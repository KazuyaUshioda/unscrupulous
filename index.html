<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>不謹慎許容度テスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- スタート画面 -->
    <section id="start" class="screen">
      <h1>不謹慎許容度テスト</h1>
      <p class="lead">ブラックジョークを40問出します。<br>それぞれ「受け入れられるか」を5段階で答えてください。</p>
      <p class="note">※ 全部ネタです。特定の誰かを傷つける意図はありません。<br>キツいと思ったら、遠慮なく「絶対ナシ」を選んでください。</p>
      <button id="startBtn" class="primary">はじめる</button>
    </section>

    <!-- 出題画面 -->
    <section id="quiz" class="screen" hidden>
      <div class="progress"><div id="bar"></div></div>
      <div class="meta"><span id="count"></span><span id="genre"></span></div>
      <p id="question"></p>
      <div id="choices"></div>
      <div class="sub">
        <button id="backBtn" class="ghost">← 戻る</button>
        <button id="skipBtn" class="ghost">意味がわからない（スキップ）</button>
      </div>
    </section>

    <!-- 結果画面 -->
    <section id="result" class="screen" hidden>
      <p id="sharedNote" class="note" hidden>友達の結果です</p>
      <p class="label">あなたの不謹慎許容度</p>
      <p id="total"></p>
      <h2 id="typeName"></h2>
      <p id="typeDesc"></p>
      <div class="chart"><canvas id="radar"></canvas></div>
      <ul id="detail"></ul>
      <div class="actions">
        <button id="shareBtn" class="primary">結果のリンクをコピー</button>
        <button id="retryBtn" class="ghost">もう一度やる</button>
      </div>
      <p id="copied" class="note" hidden></p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
